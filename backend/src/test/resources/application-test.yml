spring:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      group-id: test-group
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: none

jwt:
  secret: test-secret-key-that-is-at-least-256-bits-long-for-hs256-algorithm
  access-token-expiry: PT1H
  refresh-token-expiry: P7D

razorpay:
  key-id: test_key_id
  key-secret: test_key_secret
  webhook-secret: test_webhook_secret

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: test-bucket

encryption:
  key: test-encryption-key-32-bytes-long

logging:
  level:
    com.poultry: DEBUG
    org.springframework.security: DEBUG
