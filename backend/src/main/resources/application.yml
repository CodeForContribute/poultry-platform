server:
  port: 8082
  servlet:
    context-path: /api

spring:
  application:
    name: poultry-platform

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:poultry}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      pool-name: PoultryHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: poultry-platform
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.poultry.*

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-for-jwt-signing-must-be-at-least-256-bits}
  access-token-expiry: 15m
  refresh-token-expiry: 7d

# OTP Configuration
otp:
  length: 6
  expiry-minutes: 5
  max-attempts: 3
  rate-limit:
    max-per-hour: 5

# Platform Configuration
platform:
  fee-percent: 2.0
  payment-timeout-minutes: 30
  max-buyer-sessions: 2

# Password Policy
password:
  rotation-days: 90
  min-length: 8
  require-uppercase: true
  require-lowercase: true
  require-digit: true
  require-special: true

# MinIO Configuration
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  buckets:
    receipts: receipts
    delivery-photos: delivery-photos
    products: product-images
    reports: reconciliation-reports

# Encryption
encryption:
  key: ${ENCRYPTION_KEY:default-encryption-key-must-change-in-production}

# Rate Limiting
rate-limit:
  enabled: true
  default-requests-per-minute: 100
  auth-requests-per-minute: 20
  admin-requests-per-minute: 200
  webhook-requests-per-minute: 500
  include-headers: true
  burst-multiplier: 1.5
  whitelisted-ips:
    - "127.0.0.1"

# Security Headers
security:
  headers:
    enabled: true
    frame-options: DENY
    hsts-enabled: true
    hsts-max-age: 31536000
    hsts-include-subdomains: true
    hsts-preload: false
    referrer-policy: strict-origin-when-cross-origin
    no-cache-enabled: true

# External Services
external:
  razorpay:
    enabled: ${RAZORPAY_ENABLED:false}
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    account-number: ${RAZORPAY_ACCOUNT_NUMBER:}
  msg91:
    auth-key: ${MSG91_AUTH_KEY:}
    sender-id: ${MSG91_SENDER_ID:PLTRY}
    template-id: ${MSG91_TEMPLATE_ID:}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    phone-number: ${TWILIO_PHONE_NUMBER:}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

# Logging (defaults are production-safe, override in local profile for debugging)
logging:
  level:
    root: INFO
    com.poultry: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"

# CORS Configuration (override in production)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allow-credentials: true

# OpenAPI Configuration
openapi:
  production-url: ${OPENAPI_PRODUCTION_URL:https://api.poultry-platform.com}

# Resilience4j
resilience4j:
  circuitbreaker:
    instances:
      razorpay:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 5
      msg91:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
  retry:
    instances:
      razorpay:
        maxAttempts: 3
        waitDuration: 1s
        exponentialBackoffMultiplier: 2
      msg91:
        maxAttempts: 3
        waitDuration: 500ms

# OpenAPI
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
    urls-primary-name: all
  show-actuator: false
  group-configs:
    - group: all
      paths-to-match: /**

---
spring:
  config:
    activate:
      on-profile: local

# Local development profile with DEBUG logging
logging:
  level:
    root: INFO
    com.poultry: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE

---
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:postgresql://localhost:5432/poultry_test
    username: postgres
    password: postgres

  flyway:
    clean-disabled: false

---
spring:
  config:
    activate:
      on-profile: docker

logging:
  level:
    root: INFO
    com.poultry: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN

---
spring:
  config:
    activate:
      on-profile: kubernetes

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis

logging:
  level:
    root: INFO
    com.poultry: INFO
    org.hibernate.SQL: WARN

---
spring:
  config:
    activate:
      on-profile: production

  jpa:
    show-sql: false

external:
  razorpay:
    enabled: true

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis

security:
  headers:
    hsts-preload: true

logging:
  level:
    root: WARN
    com.poultry: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: ERROR
    org.hibernate.type.descriptor.sql: ERROR
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"
