apiVersion: v1
kind: ConfigMap
metadata:
  name: poultry-config
  namespace: poultry-platform
  labels:
    app.kubernetes.io/name: poultry-platform
data:
  # ===========================================
  # Application Configuration
  # ===========================================
  SPRING_PROFILES_ACTIVE: "kubernetes,production"

  # ===========================================
  # Database Configuration
  # ===========================================
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "poultry"

  # ===========================================
  # Redis Configuration
  # ===========================================
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"

  # ===========================================
  # Kafka Configuration
  # ===========================================
  KAFKA_SERVERS: "kafka-service:9092"

  # ===========================================
  # MinIO Configuration
  # ===========================================
  MINIO_ENDPOINT: "http://minio-service:9000"

  # ===========================================
  # Platform Business Settings
  # ===========================================
  PLATFORM_FEE_PERCENT: "2.0"
  PAYMENT_TIMEOUT_MINUTES: "30"
  MAX_BUYER_SESSIONS: "2"

  # ===========================================
  # OTP Settings
  # ===========================================
  OTP_LENGTH: "6"
  OTP_EXPIRY_MINUTES: "5"
  OTP_MAX_ATTEMPTS: "3"
  OTP_RATE_LIMIT_MAX_PER_HOUR: "5"

  # ===========================================
  # Password Policy
  # ===========================================
  PASSWORD_ROTATION_DAYS: "90"
  PASSWORD_MIN_LENGTH: "8"
  PASSWORD_REQUIRE_UPPERCASE: "true"
  PASSWORD_REQUIRE_LOWERCASE: "true"
  PASSWORD_REQUIRE_DIGIT: "true"
  PASSWORD_REQUIRE_SPECIAL: "true"

  # ===========================================
  # Rate Limiting
  # ===========================================
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_DEFAULT_RPM: "100"
  RATE_LIMIT_AUTH_RPM: "20"
  RATE_LIMIT_ADMIN_RPM: "200"
  RATE_LIMIT_WEBHOOK_RPM: "500"
  RATE_LIMIT_BURST_MULTIPLIER: "1.5"

  # ===========================================
  # Security Headers
  # ===========================================
  SECURITY_HEADERS_ENABLED: "true"
  SECURITY_FRAME_OPTIONS: "DENY"
  SECURITY_HSTS_ENABLED: "true"
  SECURITY_HSTS_MAX_AGE: "31536000"
  SECURITY_HSTS_INCLUDE_SUBDOMAINS: "true"
  SECURITY_HSTS_PRELOAD: "true"
  SECURITY_REFERRER_POLICY: "strict-origin-when-cross-origin"

  # ===========================================
  # JWT Token Settings
  # ===========================================
  JWT_ACCESS_TOKEN_EXPIRY: "15m"
  JWT_REFRESH_TOKEN_EXPIRY: "7d"

  # ===========================================
  # Resilience Settings
  # ===========================================
  CIRCUIT_BREAKER_SLIDING_WINDOW: "10"
  CIRCUIT_BREAKER_FAILURE_RATE: "50"
  CIRCUIT_BREAKER_WAIT_DURATION: "30s"
  RETRY_MAX_ATTEMPTS: "3"
  RETRY_WAIT_DURATION: "1s"

  # ===========================================
  # Connection Pool Settings
  # ===========================================
  HIKARI_MAX_POOL_SIZE: "20"
  HIKARI_MIN_IDLE: "5"
  HIKARI_IDLE_TIMEOUT: "300000"
  HIKARI_CONNECTION_TIMEOUT: "20000"
  HIKARI_MAX_LIFETIME: "1200000"

  # ===========================================
  # CORS Configuration
  # ===========================================
  CORS_ALLOWED_ORIGINS: "https://seller.poultry-platform.com,https://admin.poultry-platform.com"

  # ===========================================
  # OpenAPI Configuration
  # ===========================================
  OPENAPI_PRODUCTION_URL: "https://api.poultry-platform.com"
