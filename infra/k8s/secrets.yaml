apiVersion: v1
kind: Secret
metadata:
  name: poultry-secrets
  namespace: poultry-platform
  labels:
    app.kubernetes.io/name: poultry-platform
type: Opaque
stringData:
  # Database credentials (replace in production)
  DB_USERNAME: "postgres"
  DB_PASSWORD: "CHANGE_ME_IN_PRODUCTION"

  # Redis password
  REDIS_PASSWORD: ""

  # MinIO credentials
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "CHANGE_ME_IN_PRODUCTION"

  # JWT secret (generate a strong 256-bit key for production)
  JWT_SECRET: "CHANGE_ME_PRODUCTION_SECRET_KEY_MUST_BE_AT_LEAST_256_BITS_LONG"

  # Razorpay credentials
  RAZORPAY_KEY_ID: ""
  RAZORPAY_KEY_SECRET: ""
  RAZORPAY_WEBHOOK_SECRET: ""

  # SMS provider (MSG91)
  MSG91_AUTH_KEY: ""
  MSG91_SENDER_ID: "PLTRY"
  MSG91_TEMPLATE_ID: ""

  # Twilio (alternative SMS)
  TWILIO_ACCOUNT_SID: ""
  TWILIO_AUTH_TOKEN: ""
  TWILIO_PHONE_NUMBER: ""
