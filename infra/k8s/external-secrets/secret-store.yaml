# ==============================================================================
# SecretStore CRD Configurations
# ==============================================================================
# This file contains namespace-scoped SecretStore configurations for various
# cloud providers. Use the appropriate SecretStore for your cloud environment.
# ==============================================================================

---
# ==============================================================================
# AWS Secrets Manager SecretStore
# ==============================================================================
# Prerequisites:
# 1. Create an IAM role with SecretsManager access
# 2. Create a Kubernetes ServiceAccount with IRSA annotation (EKS)
#    OR store AWS credentials in a Kubernetes secret
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: poultry-platform
  labels:
    app.kubernetes.io/name: poultry-platform
    app.kubernetes.io/component: secrets-store
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1  # Mumbai region for India deployment
      # Option 1: Use IRSA (Recommended for EKS)
      auth:
        jwt:
          serviceAccountRef:
            name: poultry-backend
      # Option 2: Use explicit credentials (uncomment if not using IRSA)
      # auth:
      #   secretRef:
      #     accessKeyIDSecretRef:
      #       name: aws-credentials
      #       key: access-key-id
      #     secretAccessKeySecretRef:
      #       name: aws-credentials
      #       key: secret-access-key

---
# AWS Parameter Store SecretStore (alternative to Secrets Manager)
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-parameter-store
  namespace: poultry-platform
  labels:
    app.kubernetes.io/name: poultry-platform
    app.kubernetes.io/component: secrets-store
spec:
  provider:
    aws:
      service: ParameterStore
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: poultry-backend

---
# ==============================================================================
# Google Cloud Secret Manager SecretStore
# ==============================================================================
# Prerequisites:
# 1. Create a GCP service account with Secret Manager access
# 2. Use Workload Identity (GKE) or store credentials in a Kubernetes secret
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: gcp-secret-manager
  namespace: poultry-platform
  labels:
    app.kubernetes.io/name: poultry-platform
    app.kubernetes.io/component: secrets-store
spec:
  provider:
    gcpsm:
      projectID: poultry-platform-prod  # Replace with your GCP project ID
      # Option 1: Use Workload Identity (Recommended for GKE)
      auth:
        workloadIdentity:
          clusterLocation: asia-south1  # Mumbai region
          clusterName: poultry-gke-cluster
          clusterProjectID: poultry-platform-prod
          serviceAccountRef:
            name: poultry-backend
      # Option 2: Use explicit credentials (uncomment if not using Workload Identity)
      # auth:
      #   secretRef:
      #     secretAccessKeySecretRef:
      #       name: gcp-credentials
      #       key: secret-access-credentials

---
# ==============================================================================
# Azure Key Vault SecretStore
# ==============================================================================
# Prerequisites:
# 1. Create an Azure Key Vault
# 2. Configure Azure AD Pod Identity or store credentials
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: azure-key-vault
  namespace: poultry-platform
  labels:
    app.kubernetes.io/name: poultry-platform
    app.kubernetes.io/component: secrets-store
spec:
  provider:
    azurekv:
      vaultUrl: "https://poultry-platform-kv.vault.azure.net/"  # Replace with your Key Vault URL
      tenantId: "00000000-0000-0000-0000-000000000000"  # Replace with your Azure tenant ID
      # Option 1: Use Azure AD Workload Identity (Recommended for AKS)
      authType: WorkloadIdentity
      serviceAccountRef:
        name: poultry-backend
      # Option 2: Use Service Principal (uncomment if not using Workload Identity)
      # authType: ServicePrincipal
      # authSecretRef:
      #   clientId:
      #     name: azure-sp-credentials
      #     key: client-id
      #   clientSecret:
      #     name: azure-sp-credentials
      #     key: client-secret

---
# ==============================================================================
# Kubernetes Secret Store (for development/testing)
# ==============================================================================
# This store references secrets within the same Kubernetes cluster.
# Useful for development environments or migrating from existing secrets.
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: kubernetes-secrets
  namespace: poultry-platform
  labels:
    app.kubernetes.io/name: poultry-platform
    app.kubernetes.io/component: secrets-store
spec:
  provider:
    kubernetes:
      # Reference secrets from a specific namespace
      remoteNamespace: poultry-platform-secrets
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: poultry-backend
