# ==============================================================================
# ClusterSecretStore CRD Configurations
# ==============================================================================
# ClusterSecretStore is cluster-scoped and can be referenced by ExternalSecrets
# in any namespace. This is useful for centralized secret management.
#
# IMPORTANT: ClusterSecretStore should be carefully secured as it provides
# cluster-wide access to secrets.
# ==============================================================================

---
# ==============================================================================
# AWS Secrets Manager ClusterSecretStore
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager-cluster
  labels:
    app.kubernetes.io/name: poultry-platform
    app.kubernetes.io/component: cluster-secrets-store
spec:
  # Restrict which namespaces can use this store
  conditions:
    - namespaceSelector:
        matchLabels:
          external-secrets.io/allowed: "true"
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      # Use IRSA with a dedicated ServiceAccount in external-secrets namespace
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-cluster-store
            namespace: external-secrets

---
# ServiceAccount for ClusterSecretStore (requires IRSA annotation)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-cluster-store
  namespace: external-secrets
  annotations:
    # EKS IRSA annotation - replace with your IAM role ARN
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/poultry-external-secrets-role
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: cluster-secrets-store

---
# ==============================================================================
# GCP Secret Manager ClusterSecretStore
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager-cluster
  labels:
    app.kubernetes.io/name: poultry-platform
    app.kubernetes.io/component: cluster-secrets-store
spec:
  conditions:
    - namespaceSelector:
        matchLabels:
          external-secrets.io/allowed: "true"
  provider:
    gcpsm:
      projectID: poultry-platform-prod
      auth:
        workloadIdentity:
          clusterLocation: asia-south1
          clusterName: poultry-gke-cluster
          clusterProjectID: poultry-platform-prod
          serviceAccountRef:
            name: external-secrets-cluster-store
            namespace: external-secrets

---
# ==============================================================================
# Azure Key Vault ClusterSecretStore
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: azure-key-vault-cluster
  labels:
    app.kubernetes.io/name: poultry-platform
    app.kubernetes.io/component: cluster-secrets-store
spec:
  conditions:
    - namespaceSelector:
        matchLabels:
          external-secrets.io/allowed: "true"
  provider:
    azurekv:
      vaultUrl: "https://poultry-platform-kv.vault.azure.net/"
      tenantId: "00000000-0000-0000-0000-000000000000"
      authType: WorkloadIdentity
      serviceAccountRef:
        name: external-secrets-cluster-store
        namespace: external-secrets

---
# ==============================================================================
# HashiCorp Vault ClusterSecretStore
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: hashicorp-vault-cluster
  labels:
    app.kubernetes.io/name: poultry-platform
    app.kubernetes.io/component: cluster-secrets-store
spec:
  conditions:
    - namespaceSelector:
        matchLabels:
          external-secrets.io/allowed: "true"
  provider:
    vault:
      server: "https://vault.poultry-platform.internal:8200"
      path: "secret"
      version: "v2"
      namespace: "poultry"  # Vault namespace (Enterprise feature)
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "poultry-external-secrets"
          serviceAccountRef:
            name: external-secrets-cluster-store
            namespace: external-secrets

---
# ==============================================================================
# Namespace Label for External Secrets Access
# ==============================================================================
# Apply this label to namespaces that should have access to ClusterSecretStores
# kubectl label namespace <namespace> external-secrets.io/allowed=true
# ==============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: poultry-platform
  labels:
    app.kubernetes.io/name: poultry-platform
    external-secrets.io/allowed: "true"
