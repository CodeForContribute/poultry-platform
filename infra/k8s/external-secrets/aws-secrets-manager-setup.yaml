# ==============================================================================
# AWS Secrets Manager Setup for Poultry Platform
# ==============================================================================
# This file contains the IAM policy and secret structure documentation for
# integrating with AWS Secrets Manager via External Secrets Operator.
# ==============================================================================

---
# ==============================================================================
# IAM Policy for External Secrets Access
# ==============================================================================
# Deploy this IAM policy in AWS and attach it to the IAM role used by
# External Secrets Operator via IRSA (IAM Roles for Service Accounts).
#
# AWS CLI command to create the policy:
# aws iam create-policy \
#   --policy-name poultry-external-secrets-policy \
#   --policy-document file://iam-policy.json
# ==============================================================================
#
# Save as: iam-policy.json
# {
#   "Version": "2012-10-17",
#   "Statement": [
#     {
#       "Sid": "ReadSecrets",
#       "Effect": "Allow",
#       "Action": [
#         "secretsmanager:GetSecretValue",
#         "secretsmanager:DescribeSecret",
#         "secretsmanager:ListSecretVersionIds"
#       ],
#       "Resource": [
#         "arn:aws:secretsmanager:ap-south-1:*:secret:poultry-platform/*"
#       ]
#     },
#     {
#       "Sid": "ListSecrets",
#       "Effect": "Allow",
#       "Action": [
#         "secretsmanager:ListSecrets"
#       ],
#       "Resource": "*",
#       "Condition": {
#         "StringEquals": {
#           "secretsmanager:ResourceTag/application": "poultry-platform"
#         }
#       }
#     },
#     {
#       "Sid": "DecryptSecrets",
#       "Effect": "Allow",
#       "Action": [
#         "kms:Decrypt",
#         "kms:DescribeKey"
#       ],
#       "Resource": [
#         "arn:aws:kms:ap-south-1:*:key/*"
#       ],
#       "Condition": {
#         "StringEquals": {
#           "kms:ViaService": "secretsmanager.ap-south-1.amazonaws.com"
#         }
#       }
#     }
#   ]
# }
# ==============================================================================

---
# ==============================================================================
# IAM Trust Policy for IRSA
# ==============================================================================
# This trust policy allows the Kubernetes ServiceAccount to assume the IAM role.
#
# Replace:
#   - 123456789012 with your AWS account ID
#   - OIDC_PROVIDER_ID with your EKS OIDC provider ID
#   - poultry-platform with your namespace
#   - poultry-backend with your service account name
#
# Save as: trust-policy.json
# {
#   "Version": "2012-10-17",
#   "Statement": [
#     {
#       "Effect": "Allow",
#       "Principal": {
#         "Federated": "arn:aws:iam::123456789012:oidc-provider/oidc.eks.ap-south-1.amazonaws.com/id/OIDC_PROVIDER_ID"
#       },
#       "Action": "sts:AssumeRoleWithWebIdentity",
#       "Condition": {
#         "StringEquals": {
#           "oidc.eks.ap-south-1.amazonaws.com/id/OIDC_PROVIDER_ID:sub": "system:serviceaccount:poultry-platform:poultry-backend",
#           "oidc.eks.ap-south-1.amazonaws.com/id/OIDC_PROVIDER_ID:aud": "sts.amazonaws.com"
#         }
#       }
#     },
#     {
#       "Effect": "Allow",
#       "Principal": {
#         "Federated": "arn:aws:iam::123456789012:oidc-provider/oidc.eks.ap-south-1.amazonaws.com/id/OIDC_PROVIDER_ID"
#       },
#       "Action": "sts:AssumeRoleWithWebIdentity",
#       "Condition": {
#         "StringEquals": {
#           "oidc.eks.ap-south-1.amazonaws.com/id/OIDC_PROVIDER_ID:sub": "system:serviceaccount:external-secrets:external-secrets",
#           "oidc.eks.ap-south-1.amazonaws.com/id/OIDC_PROVIDER_ID:aud": "sts.amazonaws.com"
#         }
#       }
#     }
#   ]
# }
# ==============================================================================

---
# ==============================================================================
# ServiceAccount with IRSA Annotation
# ==============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: poultry-backend
  namespace: poultry-platform
  labels:
    app.kubernetes.io/name: poultry-backend
    app.kubernetes.io/component: backend
  annotations:
    # Replace with your actual IAM role ARN
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/poultry-external-secrets-role
    eks.amazonaws.com/sts-regional-endpoints: "true"

---
# ==============================================================================
# ServiceAccount for External Secrets Operator
# ==============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  namespace: external-secrets
  labels:
    app.kubernetes.io/name: external-secrets
  annotations:
    # Replace with your actual IAM role ARN
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/poultry-external-secrets-role
    eks.amazonaws.com/sts-regional-endpoints: "true"

---
# ==============================================================================
# AWS Secrets Manager Secret Structure
# ==============================================================================
# Create these secrets in AWS Secrets Manager with the following structure.
# Use the AWS CLI or Console to create them.
#
# Secret: poultry-platform/production/app
# aws secretsmanager create-secret \
#   --name poultry-platform/production/app \
#   --description "Poultry Platform application secrets" \
#   --secret-string '{
#     "jwt_secret": "your-256-bit-jwt-secret",
#     "encryption_key": "your-256-bit-encryption-key",
#     "minio_access_key": "your-minio-access-key",
#     "minio_secret_key": "your-minio-secret-key",
#     "redis_password": "your-redis-password",
#     "msg91_auth_key": "your-msg91-auth-key",
#     "msg91_sender_id": "PLTRY",
#     "msg91_template_id": "your-msg91-template-id",
#     "twilio_account_sid": "",
#     "twilio_auth_token": "",
#     "twilio_phone_number": "",
#     "fcm_project_id": "",
#     "fcm_private_key": "",
#     "fcm_client_email": ""
#   }' \
#   --tags Key=application,Value=poultry-platform Key=environment,Value=production
#
# Secret: poultry-platform/production/database/postgres
# aws secretsmanager create-secret \
#   --name poultry-platform/production/database/postgres \
#   --description "PostgreSQL credentials" \
#   --secret-string '{
#     "username": "poultry_prod",
#     "password": "your-secure-postgres-password"
#   }' \
#   --tags Key=application,Value=poultry-platform Key=environment,Value=production
#
# Secret: poultry-platform/production/database/postgres-admin
# aws secretsmanager create-secret \
#   --name poultry-platform/production/database/postgres-admin \
#   --description "PostgreSQL admin credentials" \
#   --secret-string '{
#     "username": "postgres",
#     "password": "your-secure-admin-password"
#   }' \
#   --tags Key=application,Value=poultry-platform Key=environment,Value=production
#
# Secret: poultry-platform/production/database/redis
# aws secretsmanager create-secret \
#   --name poultry-platform/production/database/redis \
#   --description "Redis credentials" \
#   --secret-string '{
#     "password": "your-secure-redis-password"
#   }' \
#   --tags Key=application,Value=poultry-platform Key=environment,Value=production
#
# Secret: poultry-platform/production/payment/razorpay
# aws secretsmanager create-secret \
#   --name poultry-platform/production/payment/razorpay \
#   --description "Razorpay payment gateway credentials" \
#   --secret-string '{
#     "enabled": "true",
#     "key_id": "rzp_live_xxxxxxxxxxxx",
#     "key_secret": "your-razorpay-key-secret",
#     "webhook_secret": "your-razorpay-webhook-secret",
#     "account_number": "your-razorpay-account-number",
#     "route_enabled": "false"
#   }' \
#   --tags Key=application,Value=poultry-platform Key=environment,Value=production
#
# Secret: poultry-platform/production/encryption/bank
# aws secretsmanager create-secret \
#   --name poultry-platform/production/encryption/bank \
#   --description "Bank account encryption keys" \
#   --secret-string '{
#     "encryption_key": "your-256-bit-bank-encryption-key",
#     "kek": "your-256-bit-key-encryption-key",
#     "encryption_key_previous": ""
#   }' \
#   --tags Key=application,Value=poultry-platform Key=environment,Value=production
# ==============================================================================

