# ==============================================================================
# ExternalSecret - Main Application Secrets
# ==============================================================================
# This ExternalSecret pulls application secrets from the configured SecretStore
# and creates a Kubernetes Secret that the application pods can consume.
#
# AWS Secrets Manager path: poultry-platform/production/app
# ==============================================================================

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: poultry-app-secrets
  namespace: poultry-platform
  labels:
    app.kubernetes.io/name: poultry-platform
    app.kubernetes.io/component: external-secret
    secret-type: application
spec:
  # Refresh interval for syncing secrets
  refreshInterval: 1h

  # Reference to the SecretStore
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore

  # Target Kubernetes Secret configuration
  target:
    name: poultry-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: poultry-platform
          app.kubernetes.io/managed-by: external-secrets
        annotations:
          external-secrets.io/last-refresh: "{{ .RefreshTime }}"
      # Template data with transformations if needed
      data:
        # JWT Configuration
        JWT_SECRET: "{{ .jwt_secret }}"

        # Encryption Key
        ENCRYPTION_KEY: "{{ .encryption_key }}"

        # MinIO/S3 Credentials
        MINIO_ACCESS_KEY: "{{ .minio_access_key }}"
        MINIO_SECRET_KEY: "{{ .minio_secret_key }}"

        # Redis Password
        REDIS_PASSWORD: "{{ .redis_password }}"

        # SMS Provider - MSG91
        MSG91_AUTH_KEY: "{{ .msg91_auth_key }}"
        MSG91_SENDER_ID: "{{ .msg91_sender_id }}"
        MSG91_TEMPLATE_ID: "{{ .msg91_template_id }}"

        # SMS Provider - Twilio (Optional)
        TWILIO_ACCOUNT_SID: "{{ .twilio_account_sid | default \"\" }}"
        TWILIO_AUTH_TOKEN: "{{ .twilio_auth_token | default \"\" }}"
        TWILIO_PHONE_NUMBER: "{{ .twilio_phone_number | default \"\" }}"

        # Firebase Cloud Messaging
        FCM_PROJECT_ID: "{{ .fcm_project_id | default \"\" }}"
        FCM_PRIVATE_KEY: "{{ .fcm_private_key | default \"\" }}"
        FCM_CLIENT_EMAIL: "{{ .fcm_client_email | default \"\" }}"

  # Data mapping from external secret to Kubernetes secret
  data:
    # JWT Secret
    - secretKey: jwt_secret
      remoteRef:
        key: poultry-platform/production/app
        property: jwt_secret

    # Encryption Key
    - secretKey: encryption_key
      remoteRef:
        key: poultry-platform/production/app
        property: encryption_key

    # MinIO Credentials
    - secretKey: minio_access_key
      remoteRef:
        key: poultry-platform/production/app
        property: minio_access_key

    - secretKey: minio_secret_key
      remoteRef:
        key: poultry-platform/production/app
        property: minio_secret_key

    # Redis Password
    - secretKey: redis_password
      remoteRef:
        key: poultry-platform/production/app
        property: redis_password

    # MSG91 Configuration
    - secretKey: msg91_auth_key
      remoteRef:
        key: poultry-platform/production/app
        property: msg91_auth_key

    - secretKey: msg91_sender_id
      remoteRef:
        key: poultry-platform/production/app
        property: msg91_sender_id

    - secretKey: msg91_template_id
      remoteRef:
        key: poultry-platform/production/app
        property: msg91_template_id

    # Twilio Configuration (Optional)
    - secretKey: twilio_account_sid
      remoteRef:
        key: poultry-platform/production/app
        property: twilio_account_sid
        decodingStrategy: None

    - secretKey: twilio_auth_token
      remoteRef:
        key: poultry-platform/production/app
        property: twilio_auth_token
        decodingStrategy: None

    - secretKey: twilio_phone_number
      remoteRef:
        key: poultry-platform/production/app
        property: twilio_phone_number
        decodingStrategy: None

    # Firebase Configuration (Optional)
    - secretKey: fcm_project_id
      remoteRef:
        key: poultry-platform/production/app
        property: fcm_project_id
        decodingStrategy: None

    - secretKey: fcm_private_key
      remoteRef:
        key: poultry-platform/production/app
        property: fcm_private_key
        decodingStrategy: None

    - secretKey: fcm_client_email
      remoteRef:
        key: poultry-platform/production/app
        property: fcm_client_email
        decodingStrategy: None

---
# ==============================================================================
# Alternative: Using dataFrom to fetch all keys from a secret
# ==============================================================================
# This approach fetches all key-value pairs from a single secret path.
# Use this when the secret structure matches your desired Kubernetes secret.
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: poultry-app-secrets-full
  namespace: poultry-platform
  labels:
    app.kubernetes.io/name: poultry-platform
    app.kubernetes.io/component: external-secret
    secret-type: application
  annotations:
    description: "Alternative approach using dataFrom for bulk secret import"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: poultry-secrets-full
    creationPolicy: Owner
    deletionPolicy: Retain
  # Fetch all keys from the secret path
  dataFrom:
    - extract:
        key: poultry-platform/production/app
        conversionStrategy: Default
        decodingStrategy: None
