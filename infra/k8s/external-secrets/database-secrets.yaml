# ==============================================================================
# ExternalSecret - Database Credentials
# ==============================================================================
# This ExternalSecret pulls database credentials from the SecretStore.
# Supports both PostgreSQL and Redis credentials.
#
# AWS Secrets Manager paths:
#   - poultry-platform/production/database/postgres
#   - poultry-platform/production/database/redis
# ==============================================================================

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: poultry-database-secrets
  namespace: poultry-platform
  labels:
    app.kubernetes.io/name: poultry-platform
    app.kubernetes.io/component: external-secret
    secret-type: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore

  target:
    name: poultry-database-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: poultry-platform
          app.kubernetes.io/component: database
          app.kubernetes.io/managed-by: external-secrets
        annotations:
          external-secrets.io/last-refresh: "{{ .RefreshTime }}"
      data:
        # PostgreSQL Credentials
        DB_USERNAME: "{{ .postgres_username }}"
        DB_PASSWORD: "{{ .postgres_password }}"

        # PostgreSQL Connection String (for direct use)
        DATABASE_URL: "postgresql://{{ .postgres_username }}:{{ .postgres_password }}@postgres-service:5432/poultry"

        # JDBC URL format (for Spring Boot)
        SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-service:5432/poultry"
        SPRING_DATASOURCE_USERNAME: "{{ .postgres_username }}"
        SPRING_DATASOURCE_PASSWORD: "{{ .postgres_password }}"

        # Redis Password
        REDIS_PASSWORD: "{{ .redis_password }}"

        # Redis Connection String
        REDIS_URL: "redis://:{{ .redis_password }}@redis-service:6379"

  data:
    # PostgreSQL Credentials
    - secretKey: postgres_username
      remoteRef:
        key: poultry-platform/production/database/postgres
        property: username

    - secretKey: postgres_password
      remoteRef:
        key: poultry-platform/production/database/postgres
        property: password

    # Redis Password
    - secretKey: redis_password
      remoteRef:
        key: poultry-platform/production/database/redis
        property: password

---
# ==============================================================================
# ExternalSecret - PostgreSQL Admin Credentials
# ==============================================================================
# Separate secret for PostgreSQL admin/superuser access.
# Use for database maintenance and migrations only.
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-admin-secrets
  namespace: poultry-platform
  labels:
    app.kubernetes.io/name: poultry-platform
    app.kubernetes.io/component: external-secret
    secret-type: database-admin
spec:
  refreshInterval: 4h  # Less frequent refresh for admin credentials
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore

  target:
    name: postgres-admin-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: poultry-platform
          app.kubernetes.io/component: database-admin
          app.kubernetes.io/managed-by: external-secrets
      data:
        POSTGRES_USER: "{{ .admin_username }}"
        POSTGRES_PASSWORD: "{{ .admin_password }}"
        POSTGRES_DB: "poultry"

  data:
    - secretKey: admin_username
      remoteRef:
        key: poultry-platform/production/database/postgres-admin
        property: username

    - secretKey: admin_password
      remoteRef:
        key: poultry-platform/production/database/postgres-admin
        property: password

---
# ==============================================================================
# ExternalSecret - Database Connection Pooler Credentials
# ==============================================================================
# For PgBouncer or other connection pooler configurations
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pgbouncer-secrets
  namespace: poultry-platform
  labels:
    app.kubernetes.io/name: poultry-platform
    app.kubernetes.io/component: external-secret
    secret-type: database-pooler
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore

  target:
    name: pgbouncer-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: poultry-platform
          app.kubernetes.io/component: pgbouncer
          app.kubernetes.io/managed-by: external-secrets
      # PgBouncer userlist.txt format
      data:
        userlist.txt: |
          "{{ .postgres_username }}" "{{ .postgres_password }}"
          "{{ .admin_username }}" "{{ .admin_password }}"

  data:
    - secretKey: postgres_username
      remoteRef:
        key: poultry-platform/production/database/postgres
        property: username

    - secretKey: postgres_password
      remoteRef:
        key: poultry-platform/production/database/postgres
        property: password

    - secretKey: admin_username
      remoteRef:
        key: poultry-platform/production/database/postgres-admin
        property: username

    - secretKey: admin_password
      remoteRef:
        key: poultry-platform/production/database/postgres-admin
        property: password
