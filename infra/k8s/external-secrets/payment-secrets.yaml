# ==============================================================================
# ExternalSecret - Payment Gateway Secrets (Razorpay)
# ==============================================================================
# This ExternalSecret pulls Razorpay payment gateway credentials.
# Critical security: These credentials should be rotated regularly.
#
# AWS Secrets Manager path: poultry-platform/production/payment/razorpay
# ==============================================================================

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: poultry-payment-secrets
  namespace: poultry-platform
  labels:
    app.kubernetes.io/name: poultry-platform
    app.kubernetes.io/component: external-secret
    secret-type: payment
  annotations:
    description: "Razorpay payment gateway credentials"
    rotation-schedule: "quarterly"
spec:
  # More frequent refresh for payment credentials
  refreshInterval: 30m

  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore

  target:
    name: poultry-payment-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: poultry-platform
          app.kubernetes.io/component: payment
          app.kubernetes.io/managed-by: external-secrets
        annotations:
          external-secrets.io/last-refresh: "{{ .RefreshTime }}"
          security.poultry-platform.com/classification: "confidential"
      data:
        # Razorpay API Credentials
        RAZORPAY_ENABLED: "{{ .razorpay_enabled }}"
        RAZORPAY_KEY_ID: "{{ .razorpay_key_id }}"
        RAZORPAY_KEY_SECRET: "{{ .razorpay_key_secret }}"

        # Razorpay Webhook Secret
        RAZORPAY_WEBHOOK_SECRET: "{{ .razorpay_webhook_secret }}"

        # Razorpay Account Number (for Route/payouts)
        RAZORPAY_ACCOUNT_NUMBER: "{{ .razorpay_account_number }}"

        # Razorpay Route configuration (if using Route for payouts)
        RAZORPAY_ROUTE_ENABLED: "{{ .razorpay_route_enabled | default \"false\" }}"

  data:
    # Razorpay Enable Flag
    - secretKey: razorpay_enabled
      remoteRef:
        key: poultry-platform/production/payment/razorpay
        property: enabled

    # Razorpay Key ID (public key)
    - secretKey: razorpay_key_id
      remoteRef:
        key: poultry-platform/production/payment/razorpay
        property: key_id

    # Razorpay Key Secret (private key)
    - secretKey: razorpay_key_secret
      remoteRef:
        key: poultry-platform/production/payment/razorpay
        property: key_secret

    # Razorpay Webhook Secret
    - secretKey: razorpay_webhook_secret
      remoteRef:
        key: poultry-platform/production/payment/razorpay
        property: webhook_secret

    # Razorpay Account Number
    - secretKey: razorpay_account_number
      remoteRef:
        key: poultry-platform/production/payment/razorpay
        property: account_number

    # Razorpay Route Enable Flag
    - secretKey: razorpay_route_enabled
      remoteRef:
        key: poultry-platform/production/payment/razorpay
        property: route_enabled
        decodingStrategy: None

---
# ==============================================================================
# ExternalSecret - Razorpay Test/Sandbox Credentials
# ==============================================================================
# For staging/test environments
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: poultry-payment-secrets-test
  namespace: poultry-platform
  labels:
    app.kubernetes.io/name: poultry-platform
    app.kubernetes.io/component: external-secret
    secret-type: payment-test
  annotations:
    description: "Razorpay test/sandbox credentials"
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore

  target:
    name: poultry-payment-secrets-test
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: poultry-platform
          app.kubernetes.io/component: payment-test
          app.kubernetes.io/managed-by: external-secrets
      data:
        RAZORPAY_ENABLED: "true"
        RAZORPAY_KEY_ID: "{{ .razorpay_key_id }}"
        RAZORPAY_KEY_SECRET: "{{ .razorpay_key_secret }}"
        RAZORPAY_WEBHOOK_SECRET: "{{ .razorpay_webhook_secret }}"
        RAZORPAY_ACCOUNT_NUMBER: "{{ .razorpay_account_number }}"
        # Test mode indicator
        RAZORPAY_TEST_MODE: "true"

  data:
    - secretKey: razorpay_key_id
      remoteRef:
        key: poultry-platform/staging/payment/razorpay
        property: key_id

    - secretKey: razorpay_key_secret
      remoteRef:
        key: poultry-platform/staging/payment/razorpay
        property: key_secret

    - secretKey: razorpay_webhook_secret
      remoteRef:
        key: poultry-platform/staging/payment/razorpay
        property: webhook_secret

    - secretKey: razorpay_account_number
      remoteRef:
        key: poultry-platform/staging/payment/razorpay
        property: account_number

---
# ==============================================================================
# ExternalSecret - Bank Account Encryption Keys
# ==============================================================================
# Keys for encrypting seller bank account details
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: poultry-bank-encryption-secrets
  namespace: poultry-platform
  labels:
    app.kubernetes.io/name: poultry-platform
    app.kubernetes.io/component: external-secret
    secret-type: encryption
  annotations:
    description: "Bank account field-level encryption keys"
spec:
  refreshInterval: 4h

  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore

  target:
    name: poultry-bank-encryption-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: poultry-platform
          app.kubernetes.io/component: encryption
          app.kubernetes.io/managed-by: external-secrets
      data:
        # Primary encryption key (AES-256-GCM)
        BANK_ENCRYPTION_KEY: "{{ .bank_encryption_key }}"

        # Key Encryption Key (for key wrapping)
        BANK_KEK: "{{ .bank_kek }}"

        # Previous key for rotation (decrypt old data)
        BANK_ENCRYPTION_KEY_PREVIOUS: "{{ .bank_encryption_key_previous | default \"\" }}"

  data:
    - secretKey: bank_encryption_key
      remoteRef:
        key: poultry-platform/production/encryption/bank
        property: encryption_key

    - secretKey: bank_kek
      remoteRef:
        key: poultry-platform/production/encryption/bank
        property: kek

    - secretKey: bank_encryption_key_previous
      remoteRef:
        key: poultry-platform/production/encryption/bank
        property: encryption_key_previous
        decodingStrategy: None
