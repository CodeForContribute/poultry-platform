apiVersion: v1
kind: Service
metadata:
  name: poultry-backend-service
  namespace: poultry-platform
  labels:
    app.kubernetes.io/name: poultry-backend
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  selector:
    app.kubernetes.io/name: poultry-backend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: poultry-backend-ingress
  namespace: poultry-platform
  labels:
    app.kubernetes.io/name: poultry-backend
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - api.poultry-platform.example.com
      secretName: poultry-backend-tls
  rules:
    - host: api.poultry-platform.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: poultry-backend-service
                port:
                  number: 80
