# ==============================================================================
# HashiCorp Vault Configuration for External Secrets
# ==============================================================================
# This file contains the configuration for using HashiCorp Vault as the
# secrets backend for External Secrets Operator.
#
# Vault provides:
# - Dynamic secrets
# - Secret versioning
# - Fine-grained access control
# - Audit logging
# - Encryption as a service
# ==============================================================================

---
# ==============================================================================
# SecretStore for HashiCorp Vault (Namespace-scoped)
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-secret-store
  namespace: poultry-platform
  labels:
    app.kubernetes.io/name: poultry-platform
    app.kubernetes.io/component: vault-secret-store
spec:
  provider:
    vault:
      # Vault server address
      server: "https://vault.poultry-platform.internal:8200"
      # Path to KV secrets engine
      path: "secret"
      # KV version (v1 or v2)
      version: "v2"
      # Vault namespace (Enterprise feature, leave empty for OSS)
      # namespace: "poultry"
      # CA certificate for TLS
      caProvider:
        type: ConfigMap
        name: vault-ca-cert
        key: ca.crt
      # Authentication method: Kubernetes
      auth:
        kubernetes:
          # Mount path for Kubernetes auth in Vault
          mountPath: "kubernetes"
          # Vault role name
          role: "poultry-backend"
          # Service account for authentication
          serviceAccountRef:
            name: poultry-backend

---
# ==============================================================================
# ClusterSecretStore for HashiCorp Vault (Cluster-scoped)
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-cluster-secret-store
  labels:
    app.kubernetes.io/name: poultry-platform
    app.kubernetes.io/component: vault-cluster-secret-store
spec:
  conditions:
    - namespaceSelector:
        matchLabels:
          vault.hashicorp.com/allowed: "true"
  provider:
    vault:
      server: "https://vault.poultry-platform.internal:8200"
      path: "secret"
      version: "v2"
      caProvider:
        type: ConfigMap
        name: vault-ca-cert
        key: ca.crt
        namespace: external-secrets
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets-cluster"
          serviceAccountRef:
            name: external-secrets-vault
            namespace: external-secrets

---
# ==============================================================================
# ServiceAccount for Vault Authentication
# ==============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-vault
  namespace: external-secrets
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: vault-auth

---
# ==============================================================================
# ConfigMap for Vault CA Certificate
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-ca-cert
  namespace: external-secrets
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: vault-ca
data:
  ca.crt: |
    # Replace with your Vault CA certificate
    -----BEGIN CERTIFICATE-----
    YOUR_VAULT_CA_CERTIFICATE_HERE
    -----END CERTIFICATE-----

---
# ==============================================================================
# ExternalSecret for Vault - Application Secrets
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vault-app-secrets
  namespace: poultry-platform
  labels:
    app.kubernetes.io/name: poultry-platform
    app.kubernetes.io/component: external-secret
    secret-source: vault
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-secret-store
    kind: SecretStore
  target:
    name: poultry-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: poultry-platform
          app.kubernetes.io/managed-by: external-secrets
          secret-source: vault
  data:
    # JWT Secret
    - secretKey: JWT_SECRET
      remoteRef:
        key: poultry-platform/app
        property: jwt_secret

    # Encryption Key
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: poultry-platform/app
        property: encryption_key

    # MinIO Credentials
    - secretKey: MINIO_ACCESS_KEY
      remoteRef:
        key: poultry-platform/app
        property: minio_access_key

    - secretKey: MINIO_SECRET_KEY
      remoteRef:
        key: poultry-platform/app
        property: minio_secret_key

    # Redis Password
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: poultry-platform/database
        property: redis_password

    # MSG91 Configuration
    - secretKey: MSG91_AUTH_KEY
      remoteRef:
        key: poultry-platform/sms
        property: msg91_auth_key

    - secretKey: MSG91_SENDER_ID
      remoteRef:
        key: poultry-platform/sms
        property: msg91_sender_id

    - secretKey: MSG91_TEMPLATE_ID
      remoteRef:
        key: poultry-platform/sms
        property: msg91_template_id

---
# ==============================================================================
# ExternalSecret for Vault - Database Secrets
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vault-database-secrets
  namespace: poultry-platform
  labels:
    app.kubernetes.io/name: poultry-platform
    app.kubernetes.io/component: external-secret
    secret-source: vault
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-secret-store
    kind: SecretStore
  target:
    name: poultry-database-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: poultry-platform
          app.kubernetes.io/component: database
          app.kubernetes.io/managed-by: external-secrets
      data:
        DB_USERNAME: "{{ .postgres_username }}"
        DB_PASSWORD: "{{ .postgres_password }}"
        REDIS_PASSWORD: "{{ .redis_password }}"
        DATABASE_URL: "postgresql://{{ .postgres_username }}:{{ .postgres_password }}@postgres-service:5432/poultry"
        SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-service:5432/poultry"
        SPRING_DATASOURCE_USERNAME: "{{ .postgres_username }}"
        SPRING_DATASOURCE_PASSWORD: "{{ .postgres_password }}"
  data:
    - secretKey: postgres_username
      remoteRef:
        key: poultry-platform/database
        property: postgres_username

    - secretKey: postgres_password
      remoteRef:
        key: poultry-platform/database
        property: postgres_password

    - secretKey: redis_password
      remoteRef:
        key: poultry-platform/database
        property: redis_password

---
# ==============================================================================
# ExternalSecret for Vault - Payment Secrets
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vault-payment-secrets
  namespace: poultry-platform
  labels:
    app.kubernetes.io/name: poultry-platform
    app.kubernetes.io/component: external-secret
    secret-source: vault
spec:
  refreshInterval: 30m
  secretStoreRef:
    name: vault-secret-store
    kind: SecretStore
  target:
    name: poultry-payment-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: poultry-platform
          app.kubernetes.io/component: payment
          app.kubernetes.io/managed-by: external-secrets
  data:
    - secretKey: RAZORPAY_ENABLED
      remoteRef:
        key: poultry-platform/payment
        property: razorpay_enabled

    - secretKey: RAZORPAY_KEY_ID
      remoteRef:
        key: poultry-platform/payment
        property: razorpay_key_id

    - secretKey: RAZORPAY_KEY_SECRET
      remoteRef:
        key: poultry-platform/payment
        property: razorpay_key_secret

    - secretKey: RAZORPAY_WEBHOOK_SECRET
      remoteRef:
        key: poultry-platform/payment
        property: razorpay_webhook_secret

    - secretKey: RAZORPAY_ACCOUNT_NUMBER
      remoteRef:
        key: poultry-platform/payment
        property: razorpay_account_number
