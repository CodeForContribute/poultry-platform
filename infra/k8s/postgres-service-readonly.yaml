---
# PostgreSQL Services for High Availability Cluster
# Primary service (read-write), Replica service (read-only), and Headless service
#
apiVersion: v1
kind: Service
metadata:
  name: postgres-ha
  namespace: poultry-platform
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: poultry-platform
  annotations:
    description: "Primary PostgreSQL service (read-write)"
    # This annotation is used by Patroni to identify the leader endpoint
    service.kubernetes.io/topology-mode: "Auto"
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
      protocol: TCP
    - name: patroni
      port: 8008
      targetPort: 8008
      protocol: TCP
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    # Patroni will add this label to the leader pod
    role: master
---
# Headless service for StatefulSet DNS resolution
apiVersion: v1
kind: Service
metadata:
  name: postgres-ha-headless
  namespace: poultry-platform
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: poultry-platform
  annotations:
    description: "Headless service for PostgreSQL StatefulSet DNS"
    # Disable load balancing to allow direct pod access
    service.alpha.kubernetes.io/tolerate-unready-endpoints: "true"
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
      protocol: TCP
    - name: patroni
      port: 8008
      targetPort: 8008
      protocol: TCP
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
---
# Read-only replica service for reporting and read-heavy workloads
apiVersion: v1
kind: Service
metadata:
  name: postgres-ha-readonly
  namespace: poultry-platform
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: poultry-platform
    service-type: readonly
  annotations:
    description: "Read-only PostgreSQL replicas for reporting and read-heavy workloads"
    prometheus.io/scrape: "true"
    prometheus.io/port: "9187"
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
      protocol: TCP
    - name: metrics
      port: 9187
      targetPort: 9187
      protocol: TCP
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    # Patroni will add this label to replica pods
    role: replica
---
# Service monitor for Prometheus Operator (if using)
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-connection-config
  namespace: poultry-platform
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
data:
  # Primary connection (read-write)
  PRIMARY_HOST: "postgres-ha.poultry-platform.svc.cluster.local"
  PRIMARY_PORT: "5432"

  # Read-only connection (for reporting)
  READONLY_HOST: "postgres-ha-readonly.poultry-platform.svc.cluster.local"
  READONLY_PORT: "5432"

  # Direct pod connections (for specific use cases)
  POD_0_HOST: "postgres-ha-0.postgres-ha-headless.poultry-platform.svc.cluster.local"
  POD_1_HOST: "postgres-ha-1.postgres-ha-headless.poultry-platform.svc.cluster.local"
  POD_2_HOST: "postgres-ha-2.postgres-ha-headless.poultry-platform.svc.cluster.local"

  # Connection string templates
  PRIMARY_JDBC_URL: "jdbc:postgresql://postgres-ha.poultry-platform.svc.cluster.local:5432/poultry?targetServerType=primary"
  READONLY_JDBC_URL: "jdbc:postgresql://postgres-ha-readonly.poultry-platform.svc.cluster.local:5432/poultry?targetServerType=preferSecondary&loadBalanceHosts=true"

  # PgBouncer compatible connection info
  PGBOUNCER_CONNECTION: |
    [databases]
    poultry = host=postgres-ha.poultry-platform.svc.cluster.local port=5432 dbname=poultry
    poultry_readonly = host=postgres-ha-readonly.poultry-platform.svc.cluster.local port=5432 dbname=poultry
---
# PodDisruptionBudget to ensure HA during maintenance
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgres-ha-pdb
  namespace: poultry-platform
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/component: database
---
# Patroni endpoint configuration (created by Patroni automatically)
# This ConfigMap documents the expected endpoints
apiVersion: v1
kind: ConfigMap
metadata:
  name: patroni-endpoints-info
  namespace: poultry-platform
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
data:
  README: |
    Patroni Endpoints
    =================

    Patroni creates and manages the following Kubernetes endpoints:

    1. poultry-postgres-cluster (leader endpoint)
       - Points to the current primary/leader pod
       - Use for read-write connections

    2. poultry-postgres-cluster-config (configuration)
       - Contains cluster configuration
       - Managed by Patroni

    3. poultry-postgres-cluster-sync (sync standby)
       - Points to synchronous standby (if configured)

    Failover Commands
    =================

    # Check cluster status
    kubectl exec -it postgres-ha-0 -n poultry-platform -- patronictl list

    # Manual failover to specific node
    kubectl exec -it postgres-ha-0 -n poultry-platform -- patronictl failover --candidate postgres-ha-1

    # Switchover (graceful)
    kubectl exec -it postgres-ha-0 -n poultry-platform -- patronictl switchover --candidate postgres-ha-1

    # Reinitialize a failed replica
    kubectl exec -it postgres-ha-0 -n poultry-platform -- patronictl reinit poultry-postgres-cluster postgres-ha-2

    Connection Examples
    ===================

    Primary (read-write):
    psql -h postgres-ha.poultry-platform.svc.cluster.local -U postgres -d poultry

    Read replicas (load balanced):
    psql -h postgres-ha-readonly.poultry-platform.svc.cluster.local -U postgres -d poultry

    Specific pod:
    psql -h postgres-ha-0.postgres-ha-headless.poultry-platform.svc.cluster.local -U postgres -d poultry

    Monitoring
    ==========

    # Patroni REST API
    curl http://postgres-ha-0.postgres-ha-headless.poultry-platform.svc.cluster.local:8008/
    curl http://postgres-ha-0.postgres-ha-headless.poultry-platform.svc.cluster.local:8008/cluster
    curl http://postgres-ha-0.postgres-ha-headless.poultry-platform.svc.cluster.local:8008/leader

    # Postgres exporter metrics
    curl http://postgres-ha-0.postgres-ha-headless.poultry-platform.svc.cluster.local:9187/metrics
