apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../k8s
  - ../../k8s/external-secrets/external-secrets-operator.yaml
  - ../../k8s/external-secrets/secret-store.yaml
  - ../../k8s/external-secrets/cluster-secret-store.yaml
  - ../../k8s/external-secrets/poultry-secrets.yaml
  - ../../k8s/external-secrets/database-secrets.yaml
  - ../../k8s/external-secrets/payment-secrets.yaml

patches:
  - target:
      kind: Secret
      name: poultry-secrets
    patch: |-
      $patch: delete
  - target:
      kind: Secret
      name: postgres-admin-secrets
    patch: |-
      $patch: delete
  - target:
      kind: Secret
      name: poultry-payment-secrets
    patch: |-
      $patch: delete
  - target:
      kind: Secret
      name: poultry-database-secrets
    patch: |-
      $patch: delete
