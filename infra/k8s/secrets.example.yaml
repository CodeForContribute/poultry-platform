apiVersion: v1
kind: Secret
metadata:
  name: poultry-secrets
  namespace: poultry-platform
  labels:
    app.kubernetes.io/name: poultry-platform
  annotations:
    description: "Production secrets template - Copy to secrets.yaml and replace with actual values"
type: Opaque
stringData:
  # ===========================================
  # Database credentials
  # Generate: openssl rand -base64 32
  # ===========================================
  DB_USERNAME: "REPLACE_WITH_DB_USERNAME"
  DB_PASSWORD: "REPLACE_WITH_SECURE_PASSWORD"

  # ===========================================
  # Redis password
  # Generate: openssl rand -base64 24
  # ===========================================
  REDIS_PASSWORD: "REPLACE_WITH_REDIS_PASSWORD"

  # ===========================================
  # MinIO credentials
  # ===========================================
  MINIO_ACCESS_KEY: "REPLACE_WITH_ACCESS_KEY"
  MINIO_SECRET_KEY: "REPLACE_WITH_SECRET_KEY"

  # ===========================================
  # JWT secret (256-bit secure key)
  # Generate: openssl rand -base64 32
  # ===========================================
  JWT_SECRET: "REPLACE_WITH_JWT_SECRET"

  # ===========================================
  # Encryption key (256-bit secure key)
  # Generate: openssl rand -base64 32
  # ===========================================
  ENCRYPTION_KEY: "REPLACE_WITH_ENCRYPTION_KEY"

  # ===========================================
  # Razorpay credentials
  # Get from: https://dashboard.razorpay.com/app/keys
  # ===========================================
  RAZORPAY_ENABLED: "true"
  RAZORPAY_KEY_ID: "REPLACE_WITH_RAZORPAY_KEY_ID"
  RAZORPAY_KEY_SECRET: "REPLACE_WITH_RAZORPAY_SECRET"
  RAZORPAY_WEBHOOK_SECRET: "REPLACE_WITH_WEBHOOK_SECRET"
  RAZORPAY_ACCOUNT_NUMBER: "REPLACE_WITH_ACCOUNT_NUMBER"

  # ===========================================
  # SMS Provider - MSG91
  # Get from: https://msg91.com/
  # ===========================================
  MSG91_AUTH_KEY: "REPLACE_WITH_MSG91_AUTH_KEY"
  MSG91_SENDER_ID: "PLTRY"
  MSG91_TEMPLATE_ID: "REPLACE_WITH_MSG91_TEMPLATE_ID"

  # ===========================================
  # SMS Provider - Twilio (Alternative)
  # Get from: https://console.twilio.com/
  # ===========================================
  TWILIO_ACCOUNT_SID: ""
  TWILIO_AUTH_TOKEN: ""
  TWILIO_PHONE_NUMBER: ""

  # ===========================================
  # Firebase Cloud Messaging
  # Get from: Firebase Console > Project Settings
  # ===========================================
  FCM_PROJECT_ID: ""
  FCM_PRIVATE_KEY: ""
  FCM_CLIENT_EMAIL: ""

  # ===========================================
  # SMTP Configuration
  # ===========================================
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
